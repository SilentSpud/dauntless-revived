# Release binaries are one file per platform with no runtime to install (M38): link the C runtime
# statically on Windows so servers and the launcher don't need the Visual C++ redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# The bundled SQLite (libsqlite3-sys) gets the compile options of the one in better-sqlite3 that
# change what SQL means, so queries behave as in the Node services: double-quoted strings are
# identifiers only, LIKE never matches BLOBs, the math and percentile functions exist, and WAL
# runs with synchronous=NORMAL. Foreign keys are on by default in both already.
[env]
LIBSQLITE3_FLAGS = "SQLITE_DQS=0 SQLITE_LIKE_DOESNT_MATCH_BLOBS SQLITE_ENABLE_MATH_FUNCTIONS SQLITE_ENABLE_PERCENTILE SQLITE_DEFAULT_WAL_SYNCHRONOUS=1 SQLITE_DEFAULT_CACHE_SIZE=-16000"
# aws-lc-sys (TLS, JWT signatures) uses its prebuilt NASM objects on Windows x64, so no NASM install
# is needed (D10). rustls turns this on through a feature; this covers crates that don't.
AWS_LC_SYS_PREBUILT_NASM = "1"
