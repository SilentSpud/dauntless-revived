[package]
name = "discord-bot"
description = "The Discord key bot: hands out launcher invites, links accounts, recovers keys and keeps the member counter (MIGRATION_PLAN.md S5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
http = "1"
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
protocol.workspace = true
rand.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
service-kit.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "fs", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
url.workspace = true
webpki-roots = "1"

[dev-dependencies]
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tempfile.workspace = true

[lints]
workspace = true
