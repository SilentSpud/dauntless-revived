[package]
name = "deploy"
description = "Starts and tracks the game servers of one machine for the metagame (MIGRATION_PLAN.md S4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
bytes = "1"
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
http = "1"
hyper.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
service-kit.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "process", "fs", "io-util"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
