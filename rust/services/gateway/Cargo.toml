[package]
name = "gateway"
description = "Public front door of a Dauntless Revived server: one TLS port in front of the metagame, the content server and chat (MIGRATION_PLAN.md S2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
chrono.workspace = true
clap.workspace = true
dotenvy.workspace = true
futures-util.workspace = true
http = "1"
http-body = "1"
http-body-util.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "server"] }
indexmap = "2"
proxy.workspace = true
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
service-kit.workspace = true
sha2.workspace = true
time = "0.3.55"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "signal", "io-util", "macros", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
url.workspace = true
x509-parser = "0.18.1"

[dev-dependencies]
axum.workspace = true
base64.workspace = true
regex.workspace = true
sha1 = "0.10"
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Security", "Win32_System_Threading"] }
