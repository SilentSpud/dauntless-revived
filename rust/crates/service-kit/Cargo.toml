[package]
name = "service-kit"
description = "What every Rust service shares: Express-compatible routing, JSON replies, pino-format logs, env-file config, serving and shutdown (MIGRATION_PLAN.md M5-M12, M24, M25, X7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
dotenvy.workspace = true
flate2.workspace = true
gethostname.workspace = true
http-body-util.workspace = true
percent-encoding.workspace = true
serde.workspace = true
# Keys in insertion order, as JavaScript objects keep them: log lines and JSON replies (SB1).
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "signal", "io-std", "io-util", "time", "sync"] }
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
flate2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
