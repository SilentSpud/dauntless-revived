# Publishes a launcher version from dauntless-revived:
#  - a versioned GitHub release launcher-v<version> with Windows and Linux packages, the Squirrel
#    update files and SHA256SUMS.txt, with a signed build provenance attestation for every file
#  - the rolling "launcher-updates" release, which installed launchers read to update themselves
#    (Squirrel RELEASES file + the newest full package; see UPDATE_FEED_URL in
#    legacy/UndauntedLauncher/src/main/constants.ts)
#
# Two ways in, both for the legacy/UndauntedLauncher/package.json version at the head of dauntless-revived:
#  - ci.yml calls it once every check passed on a push to dauntless-revived, unless the repository variable
#    LAUNCHER_AUTO_RELEASE is false, when that version has no release yet. It publishes the installer that CI
#    built and tested (the artifact named by `artifact`).
#  - Run workflow (workflow_dispatch) on dauntless-revived builds that commit and publishes its version if
#    it has no release yet. If it has one, the run only brings the self-update feed up to it, which repairs
#    a feed that a failed run left behind.
#
# The tag launcher-v<version> is created here, at the commit that was built. A version is published only
# if it is newer than every launcher-v* tag (a prerelease -x.y is published as a GitHub prerelease and
# never reaches the feed), and a published version is never replaced: raise the version to publish again.
# Re-running a failed run finishes what it started. Actions are pinned by commit.
name: Launcher release

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The launcher version to publish; must equal legacy/UndauntedLauncher/package.json "version" at this commit.
        type: string
        required: true
      artifact:
        description: The artifact of the calling run that holds the release files (from legacy/UndauntedLauncher/scripts/collect-release.ps1).
        type: string
        required: true
      linux_artifact:
        description: The artifact of the calling run that holds the Linux release files.
        type: string
        required: true

permissions: {}

jobs:
  prepare:
    name: Version and release state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      # the release files from the calling run; empty: the build job makes them
      artifact: ${{ steps.plan.outputs.artifact }}
      linux_artifact: ${{ steps.plan.outputs.linux_artifact }}
      # "true": launcher-v<version> is published already; only the feed job runs
      released: ${{ steps.plan.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            legacy/UndauntedLauncher/package.json
            tools/ci/launcher-version.js
          sparse-checkout-cone-mode: false

      - name: Work out the version and whether it is published
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CALLED_VERSION: ${{ inputs.version }}
          CALLED_ARTIFACT: ${{ inputs.artifact }}
          CALLED_LINUX_ARTIFACT: ${{ inputs.linux_artifact }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          version="$(node -p 'require("./legacy/UndauntedLauncher/package.json").version')"
          [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ] || fail "launcher releases are published from $DEFAULT_BRANCH only, not $REF"
          if [ -n "$CALLED_VERSION" ]; then
            [ "$CALLED_VERSION" = "$version" ] || fail "asked to publish $CALLED_VERSION, but package.json at this commit says $version"
            [ -n "$CALLED_ARTIFACT" ] || fail "no Windows artifact named"
            [ -n "$CALLED_LINUX_ARTIFACT" ] || fail "no Linux artifact named"
            artifact="$CALLED_ARTIFACT"
            linux_artifact="$CALLED_LINUX_ARTIFACT"
          elif [ "$EVENT" = workflow_dispatch ]; then
            artifact=""
            linux_artifact=""
          else
            fail "unexpected trigger $EVENT"
          fi
          node tools/ci/launcher-version.js valid "$version" ||
            fail "package.json version $version is not a launcher version (x.y.z or x.y.z-prerelease, no +build metadata)"
          tag="launcher-v$version"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          if out="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .html_url 2>&1)"; then
            released=true
            echo "$tag is published already ($out): nothing to build or publish; the feed job checks the self-update feed"
          elif grep -q 'HTTP 404' <<<"$out"; then
            released=false
          else
            fail "could not look up the release $tag: $out"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "artifact=$artifact"
            echo "linux_artifact=$linux_artifact"
            echo "released=$released"
          } >> "$GITHUB_OUTPUT"
          echo "launcher $version, tag $tag, prerelease $prerelease, published $released${artifact:+, Windows files from $artifact}${linux_artifact:+, Linux files from $linux_artifact}"

  build:
    name: Build and test (Windows)
    needs: prepare
    if: needs.prepare.outputs.released != 'true' && needs.prepare.outputs.artifact == ''
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
        working-directory: legacy/UndauntedLauncher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: legacy/UndauntedLauncher/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the installer
        run: npm run make

      - name: Collect the release files and their SHA-256 sums
        run: ./scripts/collect-release.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launcher-release
          path: legacy/UndauntedLauncher/release/
          if-no-files-found: error
          retention-days: 7


  build_linux:
    name: Build and test (Linux x64)
    needs: prepare
    if: needs.prepare.outputs.released != 'true' && needs.prepare.outputs.linux_artifact == ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    defaults:
      run:
        working-directory: legacy/UndauntedLauncher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: legacy/UndauntedLauncher/package-lock.json

      - name: Install Linux package tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm fakeroot squashfs-tools

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build Linux packages
        run: npm run make:linux

      - name: Collect Linux release files and their SHA-256 sums
        run: npm run collect:linux

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launcher-linux-release
          path: legacy/UndauntedLauncher/release-linux/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [prepare, build, build_linux]
    # build jobs are skipped when the calling CI run already built the files.
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.released != 'true' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.prepare.outputs.artifact != '')) &&
      (needs.build_linux.result == 'success' || (needs.build_linux.result == 'skipped' && needs.prepare.outputs.linux_artifact != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    # One publish at a time (CI and manual runs), and none is cancelled halfway. Every decision below is
    # made again inside this lock.
    concurrency:
      group: launcher-release
      cancel-in-progress: false
    outputs:
      published: ${{ steps.release.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      COMMIT: ${{ github.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci/launcher-version.js
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.artifact || 'launcher-release' }}
          path: release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.linux_artifact || 'launcher-linux-release' }}
          path: release

      - name: Check and combine the release files
        run: |
          set -euo pipefail
          nuget="$(node tools/ci/launcher-version.js nuget "$VERSION")"
          cd release
          windows_assets="$(printf '%s\n' DauntlessRevivedLauncher-Setup.exe RELEASES \
            "DauntlessRevivedLauncher-$nuget-full.nupkg" "DauntlessRevivedLauncher-$VERSION-win32-x64.zip" | sort)"
          linux_assets="$(printf '%s\n' \
            "DauntlessRevivedLauncher-$VERSION-linux-x86_64.AppImage" \
            "DauntlessRevivedLauncher-$VERSION-linux-amd64.deb" \
            "DauntlessRevivedLauncher-$VERSION-linux-x86_64.rpm" \
            "DauntlessRevivedLauncher-$VERSION-linux-x64.zip" \
            "DauntlessRevivedLauncher-$VERSION-linux-x64.tar.gz" | sort)"
          expected="$(printf '%s\n' "$windows_assets" "$linux_assets" SHA256SUMS.txt SHA256SUMS-LINUX.txt | sort)"
          actual="$(ls -A | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::these are not the complete release files of launcher $VERSION"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi

          windows_listed="$(tr -d '\r' < SHA256SUMS.txt | awk 'NF { print $2 }' | sort)"
          [ "$windows_listed" = "$windows_assets" ] || { echo "::error::Windows checksum list is incomplete"; exit 1; }
          tr -d '\r' < SHA256SUMS.txt | sha256sum --check --strict -

          linux_listed="$(tr -d '\r' < SHA256SUMS-LINUX.txt | awk 'NF { print $2 }' | sort)"
          [ "$linux_listed" = "$linux_assets" ] || { echo "::error::Linux checksum list is incomplete"; exit 1; }
          tr -d '\r' < SHA256SUMS-LINUX.txt | sha256sum --check --strict -

          { tr -d '\r' < SHA256SUMS.txt; tr -d '\r' < SHA256SUMS-LINUX.txt; } | sort -k2,2 > SHA256SUMS.merged
          mv SHA256SUMS.merged SHA256SUMS.txt
          rm SHA256SUMS-LINUX.txt
          sha256sum --check --strict SHA256SUMS.txt

      - name: Decide what to publish
        id: state
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          skip() { echo "::notice::$1"; echo "action=skip" >> "$GITHUB_OUTPUT"; exit 0; }
          # api <path> <jq filter> <file>: 0 with the filtered response in <file>, 1 on HTTP 404; any other
          # error fails the step.
          api() {
            if gh api "$1" --jq "$2" > "$3" 2> api-error.txt; then return 0; fi
            if grep -q 'HTTP 404' api-error.txt; then return 1; fi
            fail "could not read $1: $(cat api-error.txt)"
          }

          # The commit the tag points to, if the tag exists (an exact lookup, not a prefix match).
          tag_commit=""
          if api "repos/$GH_REPO/git/ref/tags/$TAG" '.object.type + " " + .object.sha' tag.txt; then
            read -r tag_type tag_commit < tag.txt
            if [ "$tag_type" = tag ]; then
              api "repos/$GH_REPO/git/tags/$tag_commit" .object.sha tag-object.txt || fail "could not read the tag object of $TAG"
              tag_commit="$(cat tag-object.txt)"
            fi
          fi

          # The release: none, draft or published.
          if gh release view "$TAG" --json isDraft --jq .isDraft > release.txt 2> release-error.txt; then
            if [ "$(cat release.txt)" = true ]; then release=draft; else release=published; fi
          elif grep -qi 'release not found' release-error.txt; then
            release=none
          else
            fail "could not look up the release $TAG: $(cat release-error.txt)"
          fi

          # Newer than every other launcher-v* tag? (A release is compared with the other releases only.)
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/launcher-v" --jq '.[].ref' > tags.txt
          others=()
          while read -r ref; do
            [ "$ref" = "refs/tags/$TAG" ] || others+=("${ref#refs/tags/launcher-v}")
          done < tags.txt
          rc=0
          blocking="$(node tools/ci/launcher-version.js newest "$VERSION" "${others[@]}")" || rc=$?
          case "$rc" in
            0) newest=true ;;
            1) newest=false ;;
            *) fail "could not compare $VERSION with the other launcher versions" ;;
          esac
          latest=false
          if [ "$newest" = true ] && [ "$PRERELEASE" != true ]; then latest=true; fi

          create_tag=false
          if [ -z "$tag_commit" ]; then
            [ "$release" = none ] || fail "a release named $TAG exists without its tag (a draft made by hand?). Delete it or publish it by hand, then run this again."
            [ "$newest" = true ] || skip "launcher $VERSION is not newer than launcher-v$blocking; nothing published. Raise the version in legacy/UndauntedLauncher/package.json."
            api "repos/$GH_REPO/git/ref/heads/$DEFAULT_BRANCH" .object.sha head.txt || fail "could not read the head of $DEFAULT_BRANCH"
            head="$(cat head.txt)"
            [ "$head" = "$COMMIT" ] || skip "$DEFAULT_BRANCH has moved on to ${head:0:12}; nothing published from ${COMMIT:0:12}. The run of the newer commit publishes."
            create_tag=true
            action=create
          elif [ "$tag_commit" = "$COMMIT" ]; then
            # An earlier attempt of this run made the tag: finish what it started.
            case "$release" in
              none) action=create ;;
              draft) action=finish ;;
              published) action=done ;;
            esac
          elif [ "$release" = published ]; then
            skip "$TAG is published already (from ${tag_commit:0:12}); nothing published. Raise the version in legacy/UndauntedLauncher/package.json."
          else
            fail "$TAG exists at ${tag_commit:0:12} but has no published release. Publish that tag by hand or delete it, then run this again."
          fi
          {
            echo "action=$action"
            echo "create_tag=$create_tag"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          echo "$TAG: $action (tag to create: $create_tag, latest: $latest)"

      # A signed statement that these files were built by this workflow from this commit:
      # gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest the build provenance of the release files
        if: steps.state.outputs.action == 'create' || steps.state.outputs.action == 'finish'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS.txt

      - name: Create the versioned release
        id: release
        if: steps.state.outputs.action != 'skip'
        env:
          ACTION: ${{ steps.state.outputs.action }}
          CREATE_TAG: ${{ steps.state.outputs.create_tag }}
          LATEST: ${{ steps.state.outputs.latest }}
        run: |
          set -euo pipefail
          prerelease_note=""
          if [ "$PRERELEASE" = true ]; then
            prerelease_note="This is a test version (a prerelease): installed launchers do not update to it."
          fi
          cat > notes.md <<EOF
          Dauntless Revived Launcher ${VERSION} for Windows and Linux. ${prerelease_note}

          Windows:
          - Installer: \`DauntlessRevivedLauncher-Setup.exe\`
          - Portable: \`DauntlessRevivedLauncher-${VERSION}-win32-x64.zip\`

          Linux x86_64:
          - Universal AppImage: \`DauntlessRevivedLauncher-${VERSION}-linux-x86_64.AppImage\`
          - Debian/Ubuntu/Mint/Pop!_OS: \`DauntlessRevivedLauncher-${VERSION}-linux-amd64.deb\`
          - Fedora/openSUSE/RHEL-family: \`DauntlessRevivedLauncher-${VERSION}-linux-x86_64.rpm\`
          - Portable ZIP: \`DauntlessRevivedLauncher-${VERSION}-linux-x64.zip\`
          - Portable tar.gz: \`DauntlessRevivedLauncher-${VERSION}-linux-x64.tar.gz\`

          Linux runs the pinned Windows game client through an installed Proton or Wine runtime. The launcher
          auto-detects Steam Proton, Proton-GE, system Wine and Lutris Wine; no game files are bundled.

          - Check your download against \`SHA256SUMS.txt\`, or check where it was built with
            \`gh attestation verify <file> --repo ${GH_REPO}\`.

          The launcher is not code-signed yet, so Windows SmartScreen may ask you to confirm
          (More info, then Run anyway). If Windows only offers "Don't run", check the file's SHA-256
          against \`SHA256SUMS.txt\` from this release (\`Get-FileHash <file>\` in PowerShell; letter
          case does not matter; if they differ, delete the file), then unblock it: right-click the
          file > Properties > Unblock, or \`Unblock-File <file>\` in PowerShell. Installed Windows
          launchers update themselves; Linux users update through their package format or a newer release.

          Free software under the GNU AGPL-3.0. No game files are included: the launcher downloads
          them from your host's server and checks every file against the list built into it.
          EOF
          if [ "$CREATE_TAG" = true ]; then
            # The tag at the commit that was built and tested. This fails if the tag appeared meanwhile.
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$COMMIT" --silent
          fi
          case "$ACTION" in
            create)
              gh release create "$TAG" release/* --verify-tag --title "Launcher ${VERSION}" --notes-file notes.md \
                --prerelease="$PRERELEASE" --latest="$LATEST"
              ;;
            finish)
              # An earlier attempt left a draft: upload every file again, then publish it.
              gh release upload "$TAG" release/* --clobber
              gh release edit "$TAG" --draft=false --title "Launcher ${VERSION}" --notes-file notes.md \
                --prerelease="$PRERELEASE" --latest="$LATEST"
              ;;
            done)
              echo "$TAG was published by an earlier attempt of this run"
              ;;
            *)
              echo "::error::unknown action $ACTION"
              exit 1
              ;;
          esac
          echo "published=true" >> "$GITHUB_OUTPUT"

  feed:
    name: Update the self-update feed
    needs: [prepare, publish]
    # Runs after a publish, and on its own when the version was published already (a manual run repairs
    # the feed). Prereleases never reach the feed.
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.prerelease != 'true' &&
      (needs.prepare.outputs.released == 'true' || needs.publish.outputs.published == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: launcher-feed
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci/launcher-version.js
          sparse-checkout-cone-mode: false

      # The feed is filled from the published release, never from local files, so it always offers exactly
      # what the release holds; the steps below can be re-run any number of times.
      - name: Point the feed at this version
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          feed=launcher-updates
          lv() { node tools/ci/launcher-version.js "$@"; }
          state="$(gh release view "$TAG" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          [ "$state" = "false false" ] || fail "$TAG is not a published full release (draft, prerelease: $state)"

          mkdir -p new current
          gh release download "$TAG" --pattern RELEASES --pattern '*-full.nupkg' --dir new --clobber
          pkg="DauntlessRevivedLauncher-$(lv nuget "$VERSION")-full.nupkg"
          [ -f "new/$pkg" ] || fail "$TAG has no $pkg"
          [ "$(find new -name '*-full.nupkg' | wc -l)" -eq 1 ] || fail "$TAG has more than one full package"
          # RELEASES must name exactly this package with its SHA-1 and size: Squirrel checks both.
          expected="$(sha1sum "new/$pkg" | cut -d' ' -f1) $pkg $(stat -c %s "new/$pkg")"
          actual="$(sed '1s/^\xEF\xBB\xBF//' new/RELEASES | tr -d '\r' | grep -v '^$')"
          [ "${actual,,}" = "${expected,,}" ] || fail "the RELEASES file of $TAG does not describe $pkg"

          if gh release view "$feed" --json assets --jq '.assets[] | "\(.name) \(.size)"' > feed-assets.txt 2> feed-error.txt; then
            if grep -qx 'RELEASES [0-9]*' feed-assets.txt; then
              gh release download "$feed" --pattern RELEASES --dir current --clobber
              offered="$(sed '1s/^\xEF\xBB\xBF//' current/RELEASES | tr -d '\r' | awk 'NF { print $2; exit }')"
              # Never move installed launchers back to an older version.
              if offered_version="$(lv from-nupkg "$offered")" &&
                 [ "$(lv compare "$offered_version" "$(lv nuget "$VERSION")")" = 1 ]; then
                echo "::notice::the feed offers a newer launcher ($offered); left as it is"
                exit 0
              fi
              if cmp -s new/RELEASES current/RELEASES && grep -qxF "$pkg $(stat -c %s "new/$pkg")" feed-assets.txt; then
                echo "the feed offers $pkg already; nothing to do"
                exit 0
              fi
            fi
          elif grep -qi 'release not found' feed-error.txt; then
            gh release create "$feed" --prerelease --title "Launcher update feed" \
              --notes "Used by installed launchers to update themselves. Download the launcher from the latest launcher-v* release instead."
          else
            fail "could not read the $feed release: $(cat feed-error.txt)"
          fi
          # New package first, then RELEASES, so the feed never points at a missing file.
          gh release upload "$feed" "new/$pkg" --clobber
          gh release upload "$feed" new/RELEASES --clobber
          gh release view "$feed" --json assets --jq '.assets[].name' | while read -r asset; do
            if [ "$asset" != "RELEASES" ] && [ "$asset" != "$pkg" ]; then
              gh release delete-asset "$feed" "$asset" --yes
            fi
          done
          echo "the feed offers launcher $VERSION ($pkg)"
