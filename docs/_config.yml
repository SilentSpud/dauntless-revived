# Site configuration for GitHub Pages (Jekyll + the just-the-docs remote theme).
# Publish from the /docs folder of the repository.

title: Dauntless Revived
tagline: Dauntless private server revival (client 1.4.4)
description: >-
  Dauntless Revived is a private server revival of Dauntless: the genuine 1.4.4 client running
  against a self-hosted fork of the open-source Undaunted server. Setup guide, status and findings.
lang: en
locale: en_US
author:
  name: mixutin
  url: https://github.com/mixutin

# Served from the repository's /docs folder on branch dauntless-revived. baseurl must match the
# repository name.
baseurl: "/dauntless-revived"
url: "https://mixutin.github.io"

# Pinned: _layouts/default.html is a copy of this version's layout (with the page language in <html lang>).
# When you move to a newer theme version, copy its _layouts/default.html again and reapply that change.
remote_theme: just-the-docs/just-the-docs@v0.12.0
# All four are on the GitHub Pages plugin allow-list. jekyll-include-cache is required by the theme.
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

# jekyll-seo-tag: links shown as sameAs in the home page's structured data.
social:
  links:
    - https://github.com/mixutin/dauntless-revived
    - https://discord.gg/ZJRprHzsgu

# Set the layout explicitly. GitHub Pages adds it implicitly, a plain Jekyll build does not.
# The default social preview image (docs/assets/og-revived.png, 1200x630: the full logo and one line of text,
# built by brand/build.py) applies to every page. jekyll-seo-tag turns the path into an absolute URL
# under url + baseurl. The file name changes whenever the image does, because link previews
# (Discord, Slack, social sites) cache images by URL.
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      image: /assets/og-revived.png

# Copied to the site as-is (no front matter, so Jekyll treats them as static files):
# llms.txt and llms-full.txt, both generated by tools/build-llms.ts.
include:
  - llms.txt
  - llms-full.txt

# Colours: the brand palette measured from the logo (brand/README.md). The scheme is
# _sass/color_schemes/revived.scss, the tokens are in _sass/custom/setup.scss and the rest of the
# look is in _sass/custom/custom.scss. The header shows the emblem and the site name
# (_includes/title.html), the home pages the full logo (_includes/home_logo.html).
color_scheme: revived

search_enabled: true
search:
  heading_level: 3
  previews: 3

# Pages link to the repository through {{ site.github.repository_url }}. GitHub Pages fills that in
# automatically (jekyll-github-metadata); in a plain local build it is empty.

# The top-bar links (Undaunted, the repository, the portfolio) are not theme aux_links: they are
# rendered in _includes/header_custom.html, so their labels follow the page's language.

heading_anchors: true
# The theme's "Back to top" link has one text for the whole site, so it is off here and
# _includes/footer_custom.html renders it in the page's language (back_to_top_text is the English one).
back_to_top: false
back_to_top_text: "Back to top"

footer_content: >-
  Dauntless Revived is an unofficial, non-commercial fan project. It is not affiliated with,
  endorsed by, or supported by Phoenix Labs or Epic Games. No game files are distributed here.
  Code: AGPL-3.0-only, based on Undaunted.
